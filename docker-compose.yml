version: "3.8"
services:
  psql:
    image: "postgres:latest"
    container_name: "database"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  hz1:
    build:
      context: ./
    image: hazelcastinstance
    depends_on:
      psql:
        condition: service_healthy
    container_name: hz-1
    environment:
      INSTANCES: hz-2,hz-3,hz-4,hz-5,hz-6,hz-7,hz-8,hz-9,hz-10
  hz2:
    image: hazelcastinstance
