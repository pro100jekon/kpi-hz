version: "3.8"
services:
  neo4j:
    image: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    environment:
      NEO4J_AUTH: neo4j/hellothere
      NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
      NEO4JLABS_PLUGINS: '["graph-data-science", "apoc"]'

volumes:
  neo4j:
    driver: local